<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>信号制御盤</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1e1d; overflow: hidden; font-family: 'BIZ UDGothic', 'Meiryo', sans-serif; }
  body { user-select: none; }
  #panel { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #panel .hit { cursor: pointer; }
  #panel .knob { transition: transform .15s cubic-bezier(.3,.1,.3,1.3); }
  #panel .keyturn { transition: transform .22s ease-out; }
  #panel .keyin { transition: opacity .18s, transform .18s; }

  /* 右上の道具（音量・小窓・ログイン）。ふだんは薄く、近づくと濃くなる */
  #tools { position: fixed; top: 6px; right: 8px; z-index: 50; display: flex; gap: 6px; align-items: center;
           background: rgba(20,24,23,.82); color: #dfe6e2; border: 1px solid #4d5c57; border-radius: 6px; padding: 4px 8px;
           font-size: 13px; opacity: .35; transition: opacity .2s; }
  #tools:hover, #tools.open { opacity: 1; }
  /* スマホなど（指で触る画面）: 道具はいつも濃く、幅に収まらなければ折り返す */
  @media (hover: none) { #tools { opacity: .9; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100vw - 16px); } #tools button { padding: 5px 9px; } }
  #tools button { white-space: nowrap; background: #2d3633; color: #e6ece8; border: 1px solid #56655f; border-radius: 4px; padding: 3px 8px; font: inherit; cursor: pointer; }
  #tools button:hover { background: #3a4642; }
  #tools input[type=range] { width: 90px; vertical-align: middle; }
  #tools .sep { width: 1px; align-self: stretch; background: #4d5c57; }

  .pop { position: fixed; z-index: 40; background: #101312; border: 1px solid #66756f; border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.6);
         display: flex; flex-direction: column; overflow: hidden; }
  .pop .grip { position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize; z-index: 1;
               background: linear-gradient(135deg, transparent 50%, #66756f 50%, #66756f 60%, transparent 60%, transparent 70%, #66756f 70%, #66756f 80%, transparent 80%); }
  .pop .bar { flex: none; display: flex; align-items: center; gap: 6px; padding: 3px 6px 3px 10px; background: #2a3330; color: #e6ece8; font-size: 13px; cursor: move; }
  .pop .bar span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .pop .bar .zoom { width: 80px; flex: none; }
  .pop .bar button { background: none; border: none; color: #e6ece8; font-size: 16px; cursor: pointer; padding: 0 4px; }
  .pop iframe { flex: 1; border: 0; width: 100%; background: #fff; }
  body.dragging .pop iframe { pointer-events: none; }
  .pop.stowed { display: none; }
  #tools button.stowed { box-shadow: inset 0 -3px 0 #4fc36a; }
  body.dragging { user-select: none; }
  /* デジタル時計（ロープレの時刻）。盤の上のどこにでも置け、右下の角で大きさを変えられる（横:縦 = 2:1） */
  #clock { position: fixed; z-index: 39; cursor: move; touch-action: none; filter: drop-shadow(0 4px 10px rgba(0,0,0,.55)); }
  #clock svg { display: block; width: 100%; height: 100%; }
  #clock .grip { position: absolute; right: 0; bottom: 0; width: 16%; height: 24%; cursor: nwse-resize; }

  #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 60; background: rgba(30,20,18,.92); color: #ffe2dc;
           border: 1px solid #a5574a; border-radius: 6px; padding: 6px 14px; font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #toast.show { opacity: 1; }

  #start { position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; background: rgba(10,12,11,.55); }
  #start button { font: inherit; font-size: 20px; padding: 14px 30px; background: #2d3633; color: #fff; border: 1px solid #8a9a94; border-radius: 8px; cursor: pointer; }

  #login { position: fixed; top: 44px; right: 8px; z-index: 55; background: #1c2220; color: #e6ece8; border: 1px solid #56655f; border-radius: 6px;
           padding: 10px 12px; font-size: 13px; display: none; }
  #login.open { display: block; }
  #login input { display: block; width: 180px; margin: 4px 0 8px; padding: 4px; font: inherit; }
  #login p { margin: 6px 0 0; color: #ffb7a8; max-width: 190px; }
  body.panning, body.panning * { cursor: grabbing !important; }
  /* 駅を選ぶ画面（?st= を付けずに開いたとき・道具の「駅」） */
  #pick { position: fixed; inset: 0; z-index: 80; display: none; align-items: center; justify-content: center; background: rgba(10,12,11,.92); color: #e6ece8; }
  #pick.open { display: flex; }
  #pick .box { background: #1c2220; border: 1px solid #56655f; border-radius: 10px; padding: 20px 24px; max-width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; box-sizing: border-box; }
  #pick h1 { margin: 0 0 14px; font-size: 20px; font-weight: normal; }
  #pick .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  #pick .list button { font: inherit; font-size: 16px; padding: 12px 8px; background: #2d3633; color: #fff; border: 1px solid #8a9a94; border-radius: 6px; cursor: pointer; }
  #pick .list button:hover:not(:disabled) { background: #3a4642; }
  #pick .list button:disabled { color: #7d8a85; border-color: #3d4844; background: #222826; cursor: default; }
  #pick .list button small { display: block; font-size: 12px; margin-top: 2px; }
  #pick .foot { margin-top: 14px; text-align: right; }
  #pick .foot button { font: inherit; background: none; color: #c9d3cf; border: 1px solid #56655f; border-radius: 4px; padding: 4px 12px; cursor: pointer; }
  #pick p { margin: 0 0 10px; color: #ffb7a8; }
  #pick p:empty { display: none; }
</style>
<script src="menulink.js"></script>
<script src="crewsession.js"></script>
</head>
<body>
<!-- 信号制御盤。relaypanel.html?st=TH71 のように駅ID を付けて開く（付けなければ、駅を選ぶ画面を出す）。?test=1 で、線路をクリックして在線を置ける（試験用） -->
<svg id="panel" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet"></svg>
<div id="tools">
  <button data-menu-link onclick="location.href='menu.html'" title="乗務メニューに戻る">メニュー</button>
  <button id="pickBtn" title="ほかの駅の盤を開く">駅</button>
  <span class="sep"></span>
  <span id="sndState" title="音量（この画面だけ）。押すと試しの音が鳴る" style="cursor:pointer">音</span><input id="vol" type="range" min="0" max="100" value="60">
  <span class="sep"></span>
  <button data-pop="tid.html?embed=1" data-title="在線位置">TID</button>
  <button data-pop="diagramview.html" data-title="ダイヤグラム">ダイヤ</button>
  <button data-pop="menu.html" data-title="乗務メニュー">タブレット</button>
  <button data-pop="radio-monitor.html?embed=1" data-title="列車無線モニター" data-w="280" data-h="460">無線</button>
  <button id="popUrl" title="ほかの画面を小窓で開く">ほか…</button>
  <button id="clockBtn" title="時計を出す・しまう">時計</button>
  <button id="phoneBtn" title="内線電話機を出す・しまう">電話</button>
  <span class="sep"></span>
  <button id="zoomIn" title="盤を大きく（ホイールでも。何もない所を引っぱると動かせる）">＋</button>
  <button id="zoomOut" title="盤を小さく">－</button>
  <button id="zoomFit" title="盤の全体を出す">全体</button>
  <span class="sep"></span>
  <button id="who">ログイン</button>
</div>
<div id="login">
  <span id="pwPart">鍵を扱う人の社員番号
  <input id="loginId" autocomplete="username" inputmode="numeric">
  パスワード
  <input id="loginPw" type="password" autocomplete="current-password">
  <button id="loginGo">ログイン</button></span> <button id="loginClose">閉じる</button>
  <p id="loginMsg"></p>
</div>
<div id="toast"></div>
<div id="start"><button>盤を開く（音が出ます）</button></div>
<div id="pick"><div class="box">
  <h1>信号制御盤を開く駅</h1>
  <p id="pickMsg"></p>
  <div class="list" id="pickList"></div>
  <div class="foot"><button data-menu-link onclick="location.href='menu.html'">‹ メニューに戻る</button> <button id="pickClose">閉じる</button></div>
</div></div>
<script src="gameclock.js"></script>
<script>
// 駅を選ぶ画面。?st= がなければ、盤は読まずにこれだけを出す。選ぶと ?st=<駅ID> を付けて開き直す（?test=1 などはそのまま）
(() => {
  const params = new URLSearchParams(location.search);
  // 電子連動装置にした駅は、denshirendo.html を開く（駅 → 画面。日野森～西赤山は 1 つの画面）
  const DENSHI = { TH61: 'TH61-TH59', TH59: 'TH61-TH59' };
  const denshi = id => { const q = new URLSearchParams(); q.set('screen', DENSHI[id]); if (params.get('test')) q.set('test', params.get('test')); location.href = 'denshirendo.html?' + q; };
  if (DENSHI[params.get('st')]) { denshi(params.get('st')); return; }
  const has = !!params.get('st');
  const pick = document.getElementById('pick'), list = document.getElementById('pickList');
  async function open(msg) {
    pick.classList.add('open');
    document.getElementById('pickMsg').textContent = typeof msg === 'string' ? msg : '';
    document.getElementById('pickClose').style.display = has && typeof msg !== 'string' ? '' : 'none';
    list.textContent = '読み込み中…';
    try {
      const sts = await (await fetch('/api/relay/stations')).json();
      list.textContent = '';
      for (const s of sts) {
        const b = document.createElement('button');
        b.textContent = s.name;
        if (!s.ready || (s.screen === 'denshirendo' && !DENSHI[s.id])) { b.disabled = true; const m = document.createElement('small'); m.textContent = '準備中'; b.appendChild(m); }
        else if (DENSHI[s.id]) b.onclick = () => denshi(s.id);
        else b.onclick = () => { params.set('st', s.id); location.search = params.toString(); };
        if (s.id === params.get('st')) b.style.borderColor = '#e6c35c';
        list.appendChild(b);
      }
    } catch (e) { list.innerHTML = '<p>駅の一覧を読めませんでした。開き直してください</p>'; }
  }
  window.relayPick = open;
  document.getElementById('pickBtn').onclick = () => open();
  document.getElementById('pickClose').onclick = () => pick.classList.remove('open');
  // 盤と内線電話機（電話機は盤の駅の電話。読む順を守る）
  if (has) for (const src of ['relaypanel/engine.js', 'extension/extphone.js', 'extension/panelphone.js']) { const sc = document.createElement('script'); sc.src = src; sc.async = false; document.body.appendChild(sc); }
  else { document.getElementById('start').style.display = 'none'; document.getElementById('tools').style.display = 'none'; open(); }
})();
</script>
</body>
</html>
