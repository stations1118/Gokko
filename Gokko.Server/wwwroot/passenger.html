<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>列車走行位置</title>
<style>
* { box-sizing:border-box }
:root {
  --navy:#10356b;
  --rail:#286fc1;
  --ink:#142a49;
  --muted:#47617e;
  --rule:#d6e3f1;
  --station-width:min(27%, 108px);
  --spine:calc(50% + var(--station-width) / 2);
}
body {margin:0;background:#e8eff7;color:var(--ink);font-family:system-ui,sans-serif}
main,header,footer {max-width:650px;margin:auto;background:white}
header {position:sticky;top:0;z-index:2;background:var(--navy);color:white;border-top:4px solid #4caaf0}
h1 {margin:0;padding:14px 16px 0;font-size:22px;line-height:1.3}
#range {margin:4px 16px 12px;color:#d3e7ff;font-size:13px}
.row,.legend {display:grid;grid-template-columns:var(--station-width) repeat(2,minmax(0,1fr));align-items:center}
.legend {padding-block:6px;background:#1b4783;text-align:center;font-size:12px;font-weight:650}
.legend span:first-child {text-align:start;padding-left:12px}
.row {position:relative;min-height:52px;background:white}
.station {background:#edf4fc;min-height:84px}
.row::before {content:"";position:absolute;inset-block:0;left:var(--spine);width:4px;transform:translateX(-50%);background:var(--rail);pointer-events:none}
.station::after {content:"";position:absolute;left:var(--spine);top:50%;transform:translate(-50%,-50%);width:9px;height:9px;border:3px solid var(--rail);border-radius:50%;background:white;pointer-events:none}
button {font:inherit;color:inherit;cursor:pointer}
button:focus-visible {outline:2px solid #226ed2;outline-offset:-2px}
.name {min-width:0;border:0;background:transparent;text-align:start}
.station .name {padding:8px 3px 8px 8px;display:grid;grid-template-columns:23px minmax(0,1fr);align-items:center;gap:5px}
.station-id {display:grid;text-align:center;border:1px solid var(--rail);border-radius:5px;overflow:hidden;color:var(--navy);background:white;line-height:1.05}
.station-id small {background:var(--rail);color:white;font-size:8px;font-weight:700;padding:1px}
.station-id b {font-size:13px;padding:1px}
.station-name {font-weight:750;font-size:clamp(14px,3.75vw,18px);line-height:1.3;overflow-wrap:anywhere}
.stop-kinds {grid-column:1 / -1;display:grid;grid-template-columns:repeat(3,minmax(0,max-content));gap:3px}
.stop-kinds:empty {display:none}
.stop-kinds .kind {padding:2px 3px;line-height:1.15;text-align:center;white-space:nowrap}
.lane {min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:4px 2px;padding:4px}
.lane:nth-child(2) {padding-right:8px}
.lane:last-child {padding-left:8px}
.train {min-width:0;width:100%;display:grid;justify-items:center;align-content:start;gap:2px;border:0;background:transparent;padding:3px 0;line-height:1.15}
.train:only-child {grid-column:1 / -1}
.train-service {min-width:0;max-width:100%;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px}
.train-service .kind {max-width:100%;overflow-wrap:anywhere;text-align:center}
.train .number {font-size:10px;font-weight:700;color:#253e60;overflow-wrap:anywhere}
.delay {color:#ae4c09;font-size:10px;font-weight:700;white-space:nowrap}
footer {position:sticky;bottom:0;z-index:1;padding:10px 14px;border-top:1px solid var(--rule);color:var(--muted);font-size:12px}
dialog {width:min(390px,92%);max-height:85vh;overflow:auto;border:0;border-radius:16px;padding:20px;color:var(--ink)}
dialog::backdrop {background:#112c4d70}
dialog h2 {margin:0;font-size:19px}dialog p {white-space:pre-line;line-height:1.8}
dialog button {padding:6px 18px;border:1px solid #9eb4cc;border-radius:8px;background:white}
#schedule table {width:100%;border-collapse:collapse;margin:12px 0;font-size:14px;font-variant-numeric:tabular-nums}
#schedule th,#schedule td {text-align:left;padding:7px 4px;border-bottom:1px solid var(--rule)}
#schedule .late-estimate {color:#b42318;font-weight:700}
#schedule th {color:#205494}#schedule small {display:block;line-height:1.6;margin-bottom:10px}
@media (max-width:360px) {
  .station .name {padding-left:4px;gap:3px}
  .stop-kinds {gap:2px}.stop-kinds .kind {padding-inline:2px}
  .train-service .kind {padding-inline:3px}
}
.service-local          { --badge-color: #111111; }
.service-limited-express{ --badge-color: #bf2027; --train-color: #d32d36; }
.service-rapid-express  { --badge-color: #773ab0; --train-color: #8542b8; }
.service-express        { --badge-color: #b74d00; --train-color: #d76a0b; }
.service-section-express{ --badge-color: #147444; --train-color: #16864f; }
.service-semi-express   { --badge-color: #205eb1; --train-color: #38a8dc; }
.service-other          { --badge-color: #586472; --train-color: #586472; }
.kind{padding:2px 5px;font-size:10px;font-weight:bold;color:white;background:var(--badge-color);border-radius:4px}
/* 列車の絵は種別の色で塗った記号（普通は黒のまま） */
.face{
  --pictogram: url("passenger-train.png");
  display:block;width:34px;height:35px;
  background:var(--pictogram) center / contain no-repeat;
}
@supports (mask-image: url("passenger-train.png")) or (-webkit-mask-image: url("passenger-train.png")) {
  .face:not(.service-local){
    background:var(--train-color);
    -webkit-mask:var(--pictogram) center / contain no-repeat;
    mask:var(--pictogram) center / contain no-repeat;
  }
}
.crowding{--ink:#24588a;--tint:#eaf3fd;display:flex;align-items:center;gap:12px;margin:14px 0;padding:12px 14px;border-radius:10px;background:var(--tint);color:var(--ink)}
.crowding.moderate{--ink:#625126;--tint:#f6f2e5}.crowding.tight{--ink:#884413;--tint:#fff1e0}.crowding.packed{--ink:#972c32;--tint:#ffeded}.crowding.unknown{--ink:#506367;--tint:#f0f4f4}
.crowd-face{font-size:30px;line-height:1}.moderate .crowd-face{filter:saturate(.65) brightness(.92)}
.crowd-info{flex:1;min-width:0}.crowd-heading{display:flex;align-items:baseline;justify-content:space-between;gap:6px;font-size:12px;font-weight:600}
.crowd-rate{font-size:21px;font-variant-numeric:tabular-nums}.crowd-message{margin-top:3px;font-size:14px;font-weight:650;line-height:1.55}
.advisory-icon{display:inline-block;background:#ffdf88;color:#553400;border-radius:4px;padding:2px 4px;line-height:1;font-size:13px}
.advisory-note{display:block;background:#fff1c9;color:#563800;border-left:3px solid #d79816;padding:8px 10px;margin:8px 0;font-size:14px;line-height:1.5}
.menu-link{position:absolute;top:14px;right:16px;padding:5px 12px;border:1px solid #6f9fd8;border-radius:8px;color:white;font-size:13px;text-decoration:none}
.menu-link:hover{background:#1b4783}
</style>
<script src="menulink.js"></script>
<header><a href="menu.html" data-menu-link class="menu-link">‹ メニュー</a><h1>列車走行位置</h1><p id="range"></p><div class="legend"><span>駅名</span><span>↑ 上り</span><span>↓ 下り</span></div></header>
<main id="map"></main><footer id="status">在線情報を読み込み中…</footer>
<dialog id="detail"><h2></h2><p></p><section id="schedule"></section><form method="dialog"><button>閉じる</button></form></dialog>
<script src="passenger.js"></script></html>
