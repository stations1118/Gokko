<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ダイヤグラム</title>
<!--
  見るだけのダイヤグラム。diagramview.html
  運行に関する編集（◆の窓・スジずらし・番線の変更など）はできない。表示は2つから選ぶ（上の「内容」）:
    ・実績と見込み: 走っている列車の実績（実線）と見込み（点線）、時刻表の計画の線
    ・時刻表だけ:   実績を出さず、時刻表の計画の線（とつなぎ線）だけを引く、シンプルな時刻表としてのダイヤグラム
  操作がないので、ログインなしで誰でも見られる（/api/diaview。読めるのは /diagram と /diagram/plan だけ）。ログインが要るのは diagrammarker.html
-->
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb;
    --accent: #2563eb; --danger: #c62828; --ok: #1b7f3b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --panel: #1d2128; --text: #e6e8eb; --muted: #9aa3ae; --line: #2e333c;
      --accent: #6b9cff; --danger: #ff6b6b; --ok: #5fd08a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px 16px; background: var(--panel); color: var(--text); font: 14px/1.5 "Yu Gothic UI", "Hiragino Sans", system-ui, sans-serif; }
  body.embed { padding: 0; }
  input, button, select { font: inherit; color: inherit; }
  input, select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  button { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  .muted { color: var(--muted); }
  .mono { font-variant-numeric: tabular-nums; }
  table { border-collapse: collapse; }
  td { padding: 3px 4px; border-bottom: 1px solid var(--line); }
  #error { color: var(--danger); }
</style>
<link rel="stylesheet" href="diagramtools.css">
<script src="menulink.js"></script>
</head>
<body>
<!-- 上のメニュー: 信号制御盤（relaypanel.html）と同じ、右上の道具の帯（diagramtools.css） -->
<div id="tools">
  <button data-menu-link onclick="location.href='menu.html'" title="乗務メニューに戻る">メニュー</button>
  <span class="sep" data-menu-link></span>
  <span id="diagramFilter"></span>
</div>
<div id="main">
<div id="error"></div>
<div id="diagram" style="position:relative; touch-action:none"></div>
<div id="diagramTip" class="muted" style="min-height:1.5em"></div>
</div>
<script src="gameclock.js"></script>
<script src="diapanel.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);

  // 右上の帯の高さだけ、図を下げる（帯が折り返して高くなっても重ならないように）
  new ResizeObserver(() => {
    const h = $("tools").offsetHeight;
    document.body.style.paddingTop = (h + 12) + "px";
  }).observe($("tools"));

  async function api(method, path) {
    if (method !== "GET") throw new Error("この画面では運行の編集はできません");
    const res = await fetch("/api/diaview" + path, { cache: "no-store" });
    let json = null;
    try { json = await res.json(); } catch (e) {}
    if (!res.ok) {
      const err = new Error((json && (json.message || json.detail)) || ("HTTP " + res.status));
      throw err;
    }
    return json;
  }

  const diagramView = GokkoDia.diagramView({ box: $("diagram"), tip: $("diagramTip"), filter: $("diagramFilter"), act: async () => {}, api, readOnly: true });

  async function refresh() {
    try { diagramView.update(await api("GET", "/diagram")); $("error").textContent = ""; }
    catch (e) { $("error").textContent = e.message; }
  }

  let polling = false; const poll = async () => { if (polling) return; polling = true; try { await refresh(); } finally { polling = false; } }; // 前の読み込みが終わっていなければ重ねて投げない（サーバーが遅いとき、要求が積み重なって配信まで詰まるため）
  // タブが裏にある間は、止めずに5回に1回だけ読む（別の窓の後ろに置いて映す使い方でも止まらないように）。
  // アドレスに ?always=1 を付けると、裏でもいつもの間隔で読む
  let hiddenTicks = 0;
  const always = /[?&]always=1/.test(location.search);
  const due = () => { if (always || !document.hidden) { hiddenTicks = 0; return true; } return ++hiddenTicks % 5 === 0; };
  GokkoClock.ready.then(() => { poll(); setInterval(() => { if (due()) poll(); }, 1000); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); }); // 見える所に戻ったら、すぐ読む
})();
</script>
</body>
</html>
