<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="none">
  <!-- 館浜（TH76）の盤面の地（1920×1080）。黒い地 panel-bg.svg を、作られて 20 年ぐらいに古びさせた版。てこ・ボタンの場所に合わせた擦れつきなので、館浜だけで使う。艶が抜けてむらになり、てこ・ボタンのまわりだけ手で擦れて鈍く光る。ふちは塗りが欠け、細い拭き傷が浮く -->
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2b2d"/><stop offset="0.45" stop-color="#1c1d1f"/><stop offset="1" stop-color="#121314"/>
    </linearGradient>
    <radialGradient id="s" cx="0.22" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#b4b6b4" stop-opacity="0.13"/><stop offset="0.5" stop-color="#b4b6b4" stop-opacity="0.04"/><stop offset="1" stop-color="#b4b6b4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.045"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="w">
      <stop offset="0" stop-color="#c9ccc8" stop-opacity="0.2"/><stop offset="0.55" stop-color="#c9ccc8" stop-opacity="0.09"/><stop offset="1" stop-color="#c9ccc8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="v" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.3"/>
    </radialGradient>
    <!-- 艶の抜けたむら（灰色がかった曇り） -->
    <filter id="matte" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.006" numOctaves="4" seed="11"/>
      <feColorMatrix values="0 0 0 0 0.62  0 0 0 0 0.62  0 0 0 0 0.58  2.2 0 0 0 -0.9"/>
    </filter>
    <!-- 黄ばんだ汚れ -->
    <filter id="stain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.007 0.009" numOctaves="3" seed="29"/>
      <feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.46  0 0 0 0 0.3  0 2.6 0 0 -1.25"/>
    </filter>
    <!-- 細い拭き傷（斜め） -->
    <filter id="hair" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0015 0.45" numOctaves="2" seed="5"/>
      <feColorMatrix values="0 0 0 0 0.85  0 0 0 0 0.86  0 0 0 0 0.84  5 0 0 0 -2.9"/>
    </filter>
    <!-- 細かいざらつき -->
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.85  0 0 0 0 0.85  0 0 0 0 0.82  0.9 0 0 0 -0.42"/>
    </filter>
    <!-- ふちの塗りの欠け（点々） -->
    <filter id="chip" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.06 0.09" numOctaves="3" seed="17"/>
      <feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.44  0 0 0 0 0.36  9 0 0 0 -6.15"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="9"/></filter>
    <mask id="edge">
      <rect width="1920" height="1080" fill="#000"/>
      <rect x="6" y="6" width="1908" height="1068" fill="none" stroke="#fff" stroke-width="34" filter="url(#blur)"/>
    </mask>
  </defs>
  <rect width="1920" height="1080" fill="url(#l)"/>
  <rect width="1920" height="1080" fill="url(#s)"/>
  <path d="M300,0 L900,0 L-180,1080 L-780,1080 Z" fill="url(#g)"/>
  <path d="M1080,0 L1210,0 L130,1080 L0,1080 Z" fill="url(#g)" opacity="0.7"/>
  <path d="M1620,0 L1960,0 L880,1080 L540,1080 Z" fill="url(#g)" opacity="0.5"/>
  <rect width="1920" height="1080" filter="url(#matte)" opacity="0.09"/>
  <rect width="1920" height="1080" filter="url(#stain)" opacity="0.04"/>
  <g transform="rotate(-32 960 540)"><rect x="-600" y="-900" width="3120" height="2880" filter="url(#hair)" opacity="0.04"/></g>
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.1"/>
  <!-- 手で擦れて鈍く光るところ: 進路のてこ（右手で握るので右下へ流れる） -->
  <g fill="url(#w)" opacity="0.7">
    <ellipse cx="612" cy="398" rx="92" ry="66"/><ellipse cx="612" cy="538" rx="96" ry="70"/>
    <ellipse cx="612" cy="678" rx="88" ry="62"/><ellipse cx="612" cy="818" rx="80" ry="58"/>
    <ellipse cx="1792" cy="538" rx="96" ry="70"/>
    <!-- 着点ボタンの下 -->
    <ellipse cx="384" cy="420" rx="52" ry="50"/><ellipse cx="384" cy="560" rx="54" ry="52"/>
    <ellipse cx="384" cy="700" rx="50" ry="48"/><ellipse cx="384" cy="840" rx="46" ry="46"/>
    <ellipse cx="1724" cy="420" rx="54" ry="52"/>
    <!-- 転てつ器のてこ、一斉停止、解放の鍵 -->
    <ellipse cx="430" cy="176" rx="40" ry="40" opacity="0.6"/><ellipse cx="540" cy="176" rx="44" ry="42" opacity="0.8"/>
    <ellipse cx="650" cy="176" rx="44" ry="42" opacity="0.8"/><ellipse cx="760" cy="176" rx="40" ry="40" opacity="0.6"/>
    <ellipse cx="1100" cy="176" rx="40" ry="40" opacity="0.6"/><ellipse cx="1210" cy="176" rx="44" ry="42" opacity="0.8"/>
    <ellipse cx="1320" cy="176" rx="40" ry="40" opacity="0.6"/>
    <ellipse cx="1690" cy="908" rx="78" ry="66" opacity="0.7"/>
    <!-- 手をつく下のふち -->
    <ellipse cx="700" cy="1050" rx="330" ry="46" opacity="0.7"/><ellipse cx="1500" cy="1052" rx="260" ry="40" opacity="0.6"/>
  </g>
  <!-- 擦り傷 -->
  <g fill="none" stroke="#dcdedb" stroke-linecap="round" opacity="0.08">
    <path d="M655,372 L742,341" stroke-width="0.9"/><path d="M661,381 L724,360" stroke-width="0.6"/>
    <path d="M652,512 L748,474" stroke-width="1"/><path d="M660,522 L716,502" stroke-width="0.6"/>
    <path d="M1826,560 L1888,611" stroke-width="0.9"/>
    <path d="M212,944 L498,921" stroke-width="1.1"/><path d="M230,953 L441,938" stroke-width="0.7"/>
    <path d="M1322,262 L1604,291" stroke-width="0.9"/>
    <path d="M940,958 L1211,921" stroke-width="1"/><path d="M86,312 L171,258" stroke-width="0.9"/>
    <path d="M1010,1012 L1168,1021" stroke-width="0.8"/>
  </g>
  <rect width="1920" height="1080" fill="url(#v)"/>
  <rect width="1920" height="1080" filter="url(#chip)" mask="url(#edge)" opacity="0.3"/>
  <rect x="12" y="12" width="1896" height="1056" fill="none" stroke="#f0efe8" stroke-width="2.4"/>
</svg>
