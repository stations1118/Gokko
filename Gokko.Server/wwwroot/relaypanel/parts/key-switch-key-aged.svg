<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88" width="88" height="88">
  <!-- 古びた版（作られて 20 年ぐらい）。もとの絵 key-switch-key.svg に、小さな塗りのはげ・くすみ・うすい黄ばみをかけたもの。大きさ・軸はもとと同じ。もとの絵を直したら作り直す -->
  <defs><filter id="worn" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.09 0.13" numOctaves="3" seed="115" result="n1"/>
    <feColorMatrix in="n1" values="0 0 0 0 0.62  0 0 0 0 0.61  0 0 0 0 0.56  9 0 0 0 -6.2" result="chip0"/><feComponentTransfer in="chip0" result="chip"><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
    <feTurbulence type="fractalNoise" baseFrequency="0.02 0.03" numOctaves="2" seed="105" result="n2"/>
    <feColorMatrix in="n2" values="0 0 0 0 0.3  0 0 0 0 0.26  0 0 0 0 0.18  0 1.8 0 0 -1.05" result="dirt"/>
    <feColorMatrix in="SourceGraphic" values="0.96 0.02 0.01 0 0  0.015 0.955 0.01 0 0  0.015 0.03 0.9 0 0  0 0 0 1 0" result="y"/>
    <feComposite in="dirt" in2="y" operator="atop" result="d"/><feComposite in="chip" in2="d" operator="atop"/>
  </filter></defs>
  <g filter="url(#worn)">
  <!-- 差した鍵の持ち手。盤の正面から見た形（平たい持ち手を、厚みの側から見ている）。中心は (44,44)。座の上に重ね、中心で回す。持ち手の長さは中心から上下 30（座の N・R の字にかからない長さ）。錠の丸い筒は座のほうに描いてあり、持ち手の下に見える -->
  <defs><linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#70748a"/><stop offset="0.45" stop-color="#565a6c"/><stop offset="1" stop-color="#2a2d3a"/></linearGradient></defs>
  <rect x="38.5" y="15.5" width="13" height="60" rx="5" fill="#141a22" opacity="0.35"/>
  <rect x="37.5" y="14" width="13" height="60" rx="5" fill="url(#h)" stroke="#151723" stroke-width="1.1"/>
  <path d="M41,19.5 V68.5" fill="none" stroke="#a6abbd" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
