<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 100" width="104" height="100">
  <!-- 古びた版（作られて 20 年ぐらい）。もとの絵 lever-base-plain.svg に、小さな塗りのはげ・くすみ・うすい黄ばみをかけたもの。大きさ・軸はもとと同じ。もとの絵を直したら作り直す -->
  <defs><filter id="worn" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.09 0.13" numOctaves="3" seed="52" result="n1"/>
    <feColorMatrix in="n1" values="0 0 0 0 0.62  0 0 0 0 0.61  0 0 0 0 0.56  9 0 0 0 -6.2" result="chip0"/><feComponentTransfer in="chip0" result="chip"><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
    <feTurbulence type="fractalNoise" baseFrequency="0.02 0.03" numOctaves="2" seed="60" result="n2"/>
    <feColorMatrix in="n2" values="0 0 0 0 0.3  0 0 0 0 0.26  0 0 0 0 0.18  0 1.8 0 0 -1.05" result="dirt"/>
    <feColorMatrix in="SourceGraphic" values="0.96 0.02 0.01 0 0  0.015 0.955 0.01 0 0  0.015 0.03 0.9 0 0  0 0 0 1 0" result="y"/>
    <feComposite in="dirt" in2="y" operator="atop" result="d"/><feComposite in="chip" in2="d" operator="atop"/>
  </filter></defs>
  <g filter="url(#worn)">
  <!-- てこの座（plain）。扇形の黒い板。細い線のふち、軸のまわりの輪、左右の小ねじ。軸の中心は (52,70)。字は倒す位置（左・まっすぐ上・右）に彫ってある -->
  <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2f3b"/><stop offset="1" stop-color="#14161d"/></linearGradient></defs>
  <g transform="translate(52 70) scale(0.9) translate(-52 -70)">
  <path d="M3,41 Q52,9 101,41 C98,57 86,70 77.5,81 A27.5,27.5 0 0 1 26.5,81 C18,70 6,57 3,41 Z" fill="#14202a" opacity="0.4" transform="translate(2 3)"/>
  <path d="M3,41 Q52,9 101,41 C98,57 86,70 77.5,81 A27.5,27.5 0 0 1 26.5,81 C18,70 6,57 3,41 Z" fill="url(#g)" stroke="#c9cfd8" stroke-width="1" stroke-linejoin="round"/>
  <circle cx="52" cy="70" r="21.5" fill="#3b404d" stroke="#0d0e14" stroke-width="1"/>
  <path d="M33.5,81 A21.5,21.5 0 0 0 73.5,70 A21.5,21.5 0 0 1 33.5,81 Z" fill="#232631"/>
  <circle cx="52" cy="70" r="17" fill="#15171e"/>
  <g fill="#6a7080" stroke="#0d0e14" stroke-width="0.8"><circle cx="22" cy="60" r="2.4"/><circle cx="82" cy="60" r="2.4"/></g>
  <g>
  </g>
  </g>
  </g>
</svg>
