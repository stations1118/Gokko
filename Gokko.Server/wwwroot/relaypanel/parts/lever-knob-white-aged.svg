<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 100" width="104" height="100">
  <!-- 古びた版（作られて 20 年ぐらい）。もとの絵 lever-knob-white.svg に、小さな塗りのはげ・くすみ・うすい黄ばみをかけたもの。大きさ・軸はもとと同じ。もとの絵を直したら作り直す -->
  <defs><filter id="worn" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.09 0.13" numOctaves="3" seed="87" result="n1"/>
    <feColorMatrix in="n1" values="0 0 0 0 0.62  0 0 0 0 0.61  0 0 0 0 0.56  9 0 0 0 -6.2" result="chip0"/><feComponentTransfer in="chip0" result="chip"><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
    <feTurbulence type="fractalNoise" baseFrequency="0.02 0.03" numOctaves="2" seed="85" result="n2"/>
    <feColorMatrix in="n2" values="0 0 0 0 0.3  0 0 0 0 0.26  0 0 0 0 0.18  0 1.8 0 0 -1.05" result="dirt"/>
    <feColorMatrix in="SourceGraphic" values="0.96 0.02 0.01 0 0  0.015 0.955 0.01 0 0  0.015 0.03 0.9 0 0  0 0 0 1 0" result="y"/>
    <feComposite in="dirt" in2="y" operator="atop" result="d"/><feComposite in="chip" in2="d" operator="atop"/>
  </filter></defs>
  <g filter="url(#worn)">
  <!-- てこの握り（white）。丸い頭から、先へ細くなる握りがのびる形。頭の黒い丸札に番号を書く。軸の中心は (52,70)。定位（N）はこの向き。左右へは軸を中心に 38 度回す -->
  <defs>
    <clipPath id="gp"><path d="M45.6,7 Q45.6,3 49.6,3 H54.4 Q58.4,3 58.4,7 L61.6,56 H42.4 Z"/></clipPath>
    <clipPath id="hd"><circle cx="52" cy="70" r="17"/></clipPath>
  </defs>
  <g transform="translate(52 70) scale(0.9) translate(-52 -70)">
  <path d="M45.6,7 Q45.6,3 49.6,3 H54.4 Q58.4,3 58.4,7 L61.6,56 H42.4 Z" fill="#0b0d12" opacity="0.35" transform="translate(2.5 3)"/>
  <circle cx="54.5" cy="73" r="17" fill="#0b0d12" opacity="0.35"/>
  <path d="M45.6,7 Q45.6,3 49.6,3 H54.4 Q58.4,3 58.4,7 L61.6,56 H42.4 Z" fill="#eceae4"/>
  <g clip-path="url(#gp)">
    <path d="M54.2,0 L58,60 H66 V0 Z" fill="#b5b6c6"/>
    <path d="M40,48 Q52,43 64,48 V60 H40 Z" fill="#b5b6c6" opacity="0.6"/>
  </g>
  <path d="M45.6,7 Q45.6,3 49.6,3 H54.4 Q58.4,3 58.4,7 L61.6,56 H42.4 Z" fill="none" stroke="#5d5e6e" stroke-width="1" stroke-linejoin="round"/>
  <circle cx="52" cy="70" r="17" fill="#eceae4"/>
  <g clip-path="url(#hd)"><path d="M52,88 A18,18 0 0 0 70,70 A18,18 0 0 0 66.5,59 A23,23 0 0 1 40,84.5 A18,18 0 0 0 52,88 Z" fill="#b5b6c6"/></g>
  <circle cx="52" cy="70" r="17" fill="none" stroke="#5d5e6e" stroke-width="1"/>
  <circle cx="52" cy="70" r="11.5" fill="#1b1d27" stroke="#e4e7ec" stroke-width="1.2"/>
  </g>
  </g>
</svg>
