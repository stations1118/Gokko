<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 104" width="104" height="104">
  <!-- 古びた版（作られて 20 年ぐらい）。もとの絵 key-lock-NR.svg に、小さな塗りのはげ・くすみ・うすい黄ばみをかけたもの。大きさ・軸はもとと同じ。もとの絵を直したら作り直す -->
  <defs><filter id="worn" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.09 0.13" numOctaves="3" seed="101" result="n1"/>
    <feColorMatrix in="n1" values="0 0 0 0 0.62  0 0 0 0 0.61  0 0 0 0 0.56  9 0 0 0 -6.2" result="chip0"/><feComponentTransfer in="chip0" result="chip"><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
    <feTurbulence type="fractalNoise" baseFrequency="0.02 0.03" numOctaves="2" seed="95" result="n2"/>
    <feColorMatrix in="n2" values="0 0 0 0 0.3  0 0 0 0 0.26  0 0 0 0 0.18  0 1.8 0 0 -1.05" result="dirt"/>
    <feColorMatrix in="SourceGraphic" values="0.96 0.02 0.01 0 0  0.015 0.955 0.01 0 0  0.015 0.03 0.9 0 0  0 0 0 1 0" result="y"/>
    <feComposite in="dirt" in2="y" operator="atop" result="d"/><feComposite in="chip" in2="d" operator="atop"/>
  </filter></defs>
  <g filter="url(#worn)">
  <!-- 解放の鍵（CTC 切換）の座。N・R の字が入った黒い板に、銀色の錠。錠の中心は (52,62)。字は鍵を回す向きに彫ってある: 真上が N（CTC）、右ななめ上が R（CTC から解放して駅で扱う）。左（L）には回らない。差した鍵は key-switch-key.svg を中心を合わせて重ね、N はまっすぐ上、R は右へ 45 度回す -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c303d"/><stop offset="0.55" stop-color="#1a1c25"/><stop offset="1" stop-color="#111218"/></linearGradient>
    <linearGradient id="m" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f7fa"/><stop offset="0.5" stop-color="#c8ccd6"/><stop offset="1" stop-color="#9196a6"/></linearGradient>
    <clipPath id="c"><circle cx="52" cy="62" r="29"/></clipPath>
  </defs>
  <path d="M8,62 V30 Q52,2 96,30 V62 A44,40 0 0 1 8,62 Z" fill="#14202a" opacity="0.4" transform="translate(2.5 3.5)"/>
  <path d="M8,62 V30 Q52,2 96,30 V62 A44,40 0 0 1 8,62 Z" fill="url(#g)" stroke="#bcc3d0" stroke-width="1.1" stroke-linejoin="round"/>
  <g><path fill="#eef2fa" transform="translate(47.68 30.1) scale(0.12)" d="M9.2,-3.4L9.2,-73.6Q9.2,-75.1 10.3,-76.2Q11.3,-77.2 12.8,-77.2L17.2,-77.2Q18.2,-77.2 19.1,-76.7Q20.0,-76.1 20.4,-75.2L55.6,-9.6L55.6,-73.8Q55.6,-75.3 56.7,-76.4Q57.8,-77.4 59.2,-77.4Q60.7,-77.4 61.8,-76.4Q62.8,-75.3 62.8,-73.8L62.8,-3.6Q62.8,-2.1 61.8,-1.1Q60.7,0.0 59.2,0.0L54.8,0.0Q53.8,0.0 52.9,-0.6Q52.0,-1.1 51.6,-2.0L16.4,-67.6L16.4,-3.4Q16.4,-1.9 15.3,-0.9Q14.2,0.2 12.8,0.2Q11.3,0.2 10.3,-0.9Q9.2,-1.9 9.2,-3.4Z"/><path fill="#eef2fa" transform="rotate(45 78.2 35.8) translate(74 40.4) scale(0.12)" d="M9.3,-3.4L9.3,-73.6Q9.3,-75.1 10.4,-76.2Q11.4,-77.2 12.9,-77.2L41.1,-77.2Q47.2,-77.2 52.3,-74.3Q57.4,-71.3 60.4,-66.3Q63.4,-61.3 63.4,-55.3Q63.4,-48.0 59.0,-42.3Q54.6,-36.5 47.6,-34.4L64.4,-5.2Q65.0,-4.4 65.0,-3.4Q65.0,-1.9 63.9,-0.9Q62.8,0.2 61.4,0.2Q60.4,0.2 59.6,-0.3Q58.7,-0.8 58.2,-1.7L39.9,-33.5L16.5,-33.5L16.5,-3.4Q16.5,-1.9 15.5,-0.9Q14.4,0.2 12.9,0.2Q11.4,0.2 10.4,-0.9Q9.3,-1.9 9.3,-3.4ZM56.2,-55.3Q56.2,-59.3 54.2,-62.7Q52.2,-66.1 48.7,-68.0Q45.2,-70.0 41.1,-70.0L16.5,-70.0L16.5,-40.7L41.1,-40.7Q45.2,-40.7 48.7,-42.7Q52.2,-44.6 54.2,-48.0Q56.2,-51.4 56.2,-55.3Z"/></g>
  <circle cx="52" cy="62" r="29" fill="url(#m)"/>
  <g clip-path="url(#c)"><path d="M40,104 L92,54 V104 Z" fill="#9196a6" opacity="0.5"/></g>
  <circle cx="52" cy="62" r="29" fill="none" stroke="#4d505f" stroke-width="1.1"/>
  <circle cx="52" cy="62" r="13" fill="#f5f7fa" stroke="#4d505f" stroke-width="1.1"/>
  <rect x="50" y="53" width="4" height="18" rx="2" fill="#1c1d2a"/>
