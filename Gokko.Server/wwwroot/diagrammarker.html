<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ダイヤグラム</title>
<!--
  ダイヤグラムの図（実績・見込み・◆・計画の線）。diagrammarker.html?scope=admin|dia&embed=1
  在線位置の tid.html と同じく、ページを分けて、管理画面（admin.html）と司令用管理画面（diasettings.html）に iframe で埋め込む（embed=1）。
  埋め込みでは scope=admin は管理画面の鍵（このタブの sessionStorage gokkoAdminKey）、dia はダイヤグラムの合言葉（localStorage gokkoDiaKey）で読み書きする。
  URL を単体で開いたときは、司令員のログインを求める（乗務タブレットと同じログイン。勤怠管理で役職「司令員」を振った人だけ。/api/dispatch）。
  embed=1 のときは余白を外し、図の高さを親の画面に知らせる（postMessage の gokkoDiagramHeight）。
  ◆を押したときの扱いの窓は、diapanel.js の作りのまま（この画面から別ウィンドウを開く）
-->
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb;
    --accent: #2563eb; --danger: #c62828; --ok: #1b7f3b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --panel: #1d2128; --text: #e6e8eb; --muted: #9aa3ae; --line: #2e333c;
      --accent: #6b9cff; --danger: #ff6b6b; --ok: #5fd08a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px 16px; background: var(--panel); color: var(--text); font: 14px/1.5 "Yu Gothic UI", "Hiragino Sans", system-ui, sans-serif; }
  body.embed { padding: 0; }
  input, button, select { font: inherit; color: inherit; }
  input, select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  button { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  .muted { color: var(--muted); }
  .mono { font-variant-numeric: tabular-nums; }
  table { border-collapse: collapse; }
  td { padding: 3px 4px; border-bottom: 1px solid var(--line); }
  #error { color: var(--danger); }
</style>
<link rel="stylesheet" href="diagramtools.css">
</head>
<body>
<!-- 上のメニュー（単体で開いたとき）: 信号制御盤（relaypanel.html）と同じ、右上の道具の帯（diagramtools.css）。埋め込みでは使わない -->
<div id="tools">
  <span id="diagramFilter"></span>
  <span class="sep"></span>
  <button id="who">ログイン</button>
</div>
<div id="login">
  <span id="pwPart">司令員の社員番号
  <input id="loginId" autocomplete="username" inputmode="numeric">
  パスワード
  <input id="loginPw" type="password" autocomplete="current-password">
  <button id="loginGo">ログイン</button></span> <button id="loginClose">閉じる</button>
  <p id="loginMsg"></p>
</div>
<div id="main">
<div id="error"></div>
<div id="diagram" style="position:relative; touch-action:none"></div>
<div id="diagramTip" class="muted" style="min-height:1.5em"></div>
</div>
<script src="gameclock.js"></script>
<script src="crewsession.js"></script>
<script src="crewlogin.js"></script>
<script src="diapanel.js"></script>
<script src="tokuhatsu-rinji.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  // 埋め込み（embed=1）は、親の画面の鍵（管理画面の鍵・設定画面の合言葉）で読み書きする。
  // URL を単体で開いたときは、司令員のログインが要る（タブレットと同じログイン。/api/dispatch）
  const embed = q.get("embed") === "1";
  const admin = embed && q.get("scope") === "admin";
  if (embed) {
    // 埋め込みでは右上の帯を使わず、絞り込みのボタンを図の上の行に置く（今までどおり）
    document.body.classList.add("embed");
    const f = $("diagramFilter");
    f.className = "row";
    $("main").insertBefore(f, $("diagram"));
    $("tools").remove();
    $("login").remove();
  } else {
    // 右上の帯の高さだけ、図を下げる（帯が折り返して高くなっても重ならないように）
    new ResizeObserver(() => {
    const h = $("tools").offsetHeight;
    document.body.style.paddingTop = (h + 12) + "px";
    $("login").style.top = (h + 12) + "px"; // ログインの小窓は帯のすぐ下
  }).observe($("tools"));
  }
  const login = embed ? null : GokkoLogin.create({ who: $("who"), panel: $("login"),
    onLogin: () => { asked = false; $("main").hidden = false; refresh(); }, onLogout: () => { asked = false; refresh(); } });
  const keyOf = () => {
    if (login) return login.token();
    try { return (admin ? sessionStorage.getItem("gokkoAdminKey") : localStorage.getItem("gokkoDiaKey")) || ""; } catch (e) { return ""; }
  };
  const base = login ? "/api/dispatch" : admin ? "/api/admin" : "/api/dia";
  const header = login ? "X-Crew-Token" : admin ? "X-Admin-Key" : "X-Dia-Key";

  // 埋め込んだとき: 親の画面（司令用管理画面・管理画面）が毎秒読んでいる /diagram の答えを使う（同じものを2か所から読まない）。
  // 自分で操作した直後（◆をずらしたなど）は、すぐ見えるように自分で読み直す。親の答えが古い・ないときも自分で読む
  let freshUntil = 0;
  function sharedDiagram() {
    if (!embed || window.parent === window || Date.now() < freshUntil) return null;
    try {
      const s = window.parent.gokkoDiagram;
      return s && Date.now() - s.at < 2500 ? structuredClone(s.data) : null;
    } catch (e) { return null; }
  }

  async function api(method, path, body) {
    if (method !== "GET") freshUntil = Date.now() + 3000;
    const res = await fetch(base + path, {
      method,
      // 司令用管理画面に埋め込んだとき（scope=dia）は、合言葉がなくても司令員のログイン（このタブの合い札）で入れる
      headers: { [header]: keyOf(), ...(embed && !admin && GokkoCrew.token() ? { "X-Crew-Token": GokkoCrew.token() } : {}), "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
      cache: "no-store"
    });
    let json = null;
    try { json = await res.json(); } catch (e) {}
    if (!res.ok) {
      const err = new Error((json && (json.message || json.detail)) || ("HTTP " + res.status));
      err.login = !!(json && json.login);
      throw err;
    }
    return json;
  }

  async function act(method, path, body) {
    try { await api(method, path, body); $("error").textContent = ""; await refresh(); }
    catch (e) { $("error").textContent = e.message; }
  }

  const diagramView = GokkoDia.diagramView({ box: $("diagram"), tip: $("diagramTip"), filter: $("diagramFilter"), act, api });

  // 埋め込んだときは、図の高さを親の画面に知らせる（変わったときだけ）
  let lastHeight = 0;
  function tellHeight() {
    if (!embed || window.parent === window) return;
    // documentElement の高さは iframe の高さに引きずられて伸び続けることがあるので、本体（body）の高さで測る
    const h = Math.ceil(document.body.getBoundingClientRect().height) + 2;
    if (h === lastHeight) return;
    lastHeight = h;
    window.parent.postMessage({ gokkoDiagramHeight: h }, location.origin);
  }

  // ログインが要るとき: 図を隠して、ログインの小窓を出す（閉じたら、ボタンを押すまで出し直さない）
  let asked = false;
  function needLogin(message) {
    $("main").hidden = true;
    if (!asked) { asked = true; login.show(message); }
  }

  async function refresh() {
    if (login) {
      if (login.shown()) return; // ログインの小窓を出している間は読まない
      login.showWho();
      if (!login.token()) { needLogin(""); return; }
    } else if (!keyOf()) { $("error").textContent = admin ? "管理キーを保存すると、図を出します" : "合言葉を保存すると、図を出します"; tellHeight(); return; }
    try {
      diagramView.update(sharedDiagram() || await api("GET", "/diagram"));
      if ($("error").textContent.endsWith("図を出します")) $("error").textContent = "";
      $("main").hidden = false;
    } catch (e) {
      if (login && e.login) { needLogin(e.message); return; }
      $("error").textContent = e.message;
    }
    tellHeight();
  }

  window.addEventListener("resize", tellHeight);
  let polling = false; const poll = async () => { if (polling) return; polling = true; try { await refresh(); } finally { polling = false; } }; // 前の読み込みが終わっていなければ重ねて投げない（サーバーが遅いとき、要求が積み重なって配信まで詰まるため）
  // この画面は、裏にあっても読み続ける（◆の窓は別の窓なので、この画面が後ろに隠れている間も中身を新しくする）
  GokkoClock.ready.then(() => { poll(); setInterval(poll, 1000); });
})();
</script>
</body>
</html>
